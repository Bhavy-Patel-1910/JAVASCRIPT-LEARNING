<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download UI</title>

<style>

.main1{
    display: flex;
    justify-content: center;
    align-items: center;
    height: 50vh;
}
.card{
    width:320px;
    background:#fff;
    padding:25px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

.file-name{
    font-size:16px;
    margin-bottom:15px;
    color:#555;
}

.progress-box{
    width:100%;
    height:12px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:10px;
}

.progress{
    width:0%;
    height:100%;
    background:#4CAF50;
}

.info{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    color:#666;
    margin-bottom:20px;
}

.main2{
    background-color: #333;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
    border-radius: 15px;
    height: 50vh;
    width: 50%;
    font-family: gilroy ;
    font-weight: 600;
    font-size: 60px;
}

</style>

</head>
<body>
<div class="main1">

<div class="card">

    <h2 class="card-title">Downloading...</h2>

    <div class="file-name">
        📄 project.zip
    </div>

    <div class="progress-box">
        <div class="progress"></div>
    </div>

    <div class="info">
        <span class="percentage">0%</span>   
    </div>


</div> 

</div>


</br> </br><div class="main2">HEllow</div>


<script src="script.js"></script>
</body>
</html>
