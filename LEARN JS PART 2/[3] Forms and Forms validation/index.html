<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        #main1{
            background-color: #222;
            height: 500px;
            width: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            
        }

        #small1{
            color: rgb(255, 0, 0);
            font-weight: 400;
        }

        #hide1{
            display: none;
        }

        #main2{
            background-color: #222;
            height: 500px;
            width: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #main3{
            background-color: #222;
            height: 500px;
            width: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #main4{
            background-color: #222;
            height: 500px;
            width: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main5 {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        #form5 {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
        }

        .error {
            color: red;
            font-size: 14px;
            display: block;
            margin-top: 5px;
            min-height: 18px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #007bff;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
        

    </style>

</head>

<body>
1. <div id="main1">

    <form id="form1">

        <input id="name1" type="text" placeholder="Name">
        <div id="hide1">
            <br>
            <small id="small1"> Your Name Should Be Greator Than 2 Charactors. </small>
        </div> <br> <br>
        <input type="email" placeholder="E-mail"> <br> <br>
        <input type="password" placeholder="Password"> <br> <br>
        <input type="text" placeholder="Tell Me About Your Self....."> <br> <br>
        <select >
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="others">Others</option>
        </select> <br> <br>
        <input type="submit">

    </form>
</div>

    2. <div id="main2">

    <form id="form2">

        <input id="name2" type="text" placeholder="Name" required minlength="3" maxlength="10"><br> <br>
        <input type="email" placeholder="E-mail"> <br> <br>
        <input type="password" placeholder="Password"> <br> <br>
        <input type="text" placeholder="Tell Me About Your Self....."> <br> <br>
        <select >
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="others">Others</option>
        </select> <br> <br>
        <input type="submit">

    </form>
</div>

3. <div id="main3">

    <form id="form3">
        <input pattern="[a-z]{3,8}" required id="name3" type="text" placeholder="Name" ><br> <br>
        <input type="email" placeholder="E-mail"> <br> <br>
        <input type="password" placeholder="Password"> <br> <br>
        <input type="text" placeholder="Tell Me About Your Self....."> <br> <br>
        <select >
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="others">Others</option>
        </select> <br> <br>
        <input type="submit">
    </form>
</div>

4. <div id="main4">

    <form id="form4">
        <input id="name4" type="text" placeholder="Name" ><br> <br>
        <input id="email4" type="email" placeholder="E-mail"> <br> <br>
        <input type="password" placeholder="Password"> <br> <br>
        <input type="text" placeholder="Tell Me About Your Self....."> <br> <br>
        <select >
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="others">Others</option>
        </select> <br> <br>
        <input type="submit">
    </form>
</div>

5. <div class="main5">
        <form id="form5">

            <h2>Login Form</h2>

            <div class="input-group">
                <label for="email">Email</label>
                <input
                    type="text"
                    id="email5"
                    placeholder="Enter your email"
                >
                <small class="error" id="emailError5"></small>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password5"
                    placeholder="Enter your password"
                >
                <small class="error" id="passwordError5"></small>
            </div>

            <button type="submit">Submit</button>

        </form>
        
        <div id="resultmsg5"></div>

    </div>


    <script src="Formsvalidation.js"></script>
</body>
</html>
