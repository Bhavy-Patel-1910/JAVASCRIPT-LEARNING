<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        #main1{
            background-color: #222;
            height: 500px;
            width: 500px;

        #main2{
            background-color: #222;

        }

1. <div id="main1">

    <form id="form1">

        </div> <br> <br>

</div>

    2. <div id="main2">
